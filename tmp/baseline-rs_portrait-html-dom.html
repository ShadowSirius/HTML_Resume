      if (n.id && actSet.has(n.id)) { hiSet.add(n); let p = n.parent; while (p && p.px != null) { ancSet.add(p); p = p.parent; } }
    });
    const dimB = n => actSet && !hiSet.has(n) && !ancSet.has(n);
    const onB = n => hiSet.has(n);

    // ---------- BRANCHES + PROJECT BRIEFS (above ground) ----------
    let order = Object.keys(PROJECTS).sort((a, b) => parseInt(PROJECTS[a].year) - parseInt(PROJECTS[b].year));
    if ((this.props.sortDirection || "oldest-bottom") === "newest-bottom") order.reverse();
    const cardW = 196, cardH = 112, erx = 124, ery = 64;
    const TIER = [292, 200, 300, 216, 272];
    const briefs = order.map((id, k) => {
      const left = k % 2 === 0, r = Math.floor(k / 2), nr = Math.ceil(order.length / 2);
      const rt = nr > 1 ? r / (nr - 1) : 0;                      // 0 = lowest bough, 1 = highest
      const baseY = groundY - 16 - rt * (groundY - trunkTop - 124);
      const rise = 66 + rt * 18;                                 // boughs arc upward
      const dist = TIER[r % TIER.length] - (left ? 0 : 12);
      let tipX = left ? cx - dist : cx + dist;
      tipX = Math.max(erx + 10, Math.min(W - erx - 10, tipX));
      const tipY = Math.max(ery + 12, baseY - rise);
      const imp = (PROJECTS[id].activeSkills || []).length;
      const dc = (this.state.drag || {})["c:" + id] || { dx: 0, dy: 0 };
      return { id, baseY, tipX: tipX + dc.dx, tipY: tipY + dc.dy, left, imp, erx, ery };
    });

    const els = [];
    // ground line
    els.push(h("line", { key: "g", x1: 30, y1: groundY, x2: W - 30, y2: groundY, stroke: "#334155", strokeWidth: 1.4, strokeDasharray: "2 7", strokeLinecap: "round" }));
    els.push(h("text", { key: "gl1", x: 34, y: groundY - 8, fontFamily: "ui-monospace,Menlo,monospace", fontSize: 9, fontWeight: 700, letterSpacing: ".12em", fill: "#475569" }, "\u25B2 EXPERIENCE"));
    els.push(h("text", { key: "gl2", x: W - 34, y: H - 30, textAnchor: "end", fontFamily: "ui-monospace,Menlo,monospace", fontSize: 9, fontWeight: 700, letterSpacing: ".12em", fill: "#475569" }, "SKILL ROOTS \u25BC"));

    // trunk — a bundle of parallel stems rising from the ground, as drawn
    (function(){
      const off = [-9, -5.5, -2, 1.5, 5, 8.5];
      off.forEach((o, s) => {
        const top = trunkTop + Math.abs(o) * 7;              // inner stems run highest
        els.push(h("path", { key: "tk" + s, d: `M${cx + o},${groundY} C${cx + o * 0.9},${(groundY + top) / 2} ${cx + o * 0.5},${top + 60} ${cx + o * 0.35},${top}`,
          stroke: "#7c8ba5", strokeWidth: s === 2 || s === 3 ? 1.5 : 1.1, strokeOpacity: 0.85, fill: "none", strokeLinecap: "round" }));
      });
    })();

    // root links — style selectable: curved (organic), straight, or stepped ("progressive")
    const gStyle = this.props.rootStyle || "straight";
    const lStyle = this.state.linkStyle || {};
    const rootD = (s, t, style) => {
      const sx = s.px, sy = s.py, tx = t.px, ty = t.py;
      if (style === "straight") return `M${sx},${sy}L${tx},${ty}`;
      if (style === "stepped") { const my = sy + (ty - sy) * 0.5; return `M${sx},${sy}L${sx},${my}L${tx},${ty}`; }
      const mx = (sx + tx) / 2, my = (sy + ty) / 2, dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1, off = len * 0.15 * (mx < cx ? -1 : 1);
      return `M${sx},${sy}Q${mx + (-dy / len) * off},${my + (dx / len) * off} ${tx},${ty}`;
    };
    bLinks.forEach((n, i) => {
      const act = onB(n) || ancSet.has(n), src = srcOf(n);
      const style = lStyle[n.id] || gStyle;
      const d = rootD(src, n, style);
      els.push(h("path", { key: "rl" + i, d, stroke: act ? CAT[n.cat] : "#64748b", strokeOpacity: dimB(n) ? 0.08 : (onB(n) ? 0.9 : (act ? 0.55 : 0.42)), strokeWidth: (0.85 + 1.15 * Math.sqrt(n.wgt || 1)) * (onB(n) ? 1.5 : (act ? 1.2 : 1)), strokeLinecap: "round", fill: "none" }));
      // invisible fat hit-area → click to pick this link's style
      els.push(h("path", { key: "rh" + i, d, stroke: "transparent", strokeWidth: 10, fill: "none", style: { cursor: "pointer" }, onClick: e => { e.stopPropagation(); this.setState({ menu: { id: n.id, x: (src.px + n.px) / 2, y: (src.py + n.py) / 2 } }); } }));
    });
    // root nodes (draggable)
    bNodes.forEach((n, i) => {
      const o = dimB(n) ? 0.1 : 1, big = onB(n);
      let r = Math.min(7.5, 1.7 + 1.15 * Math.sqrt(n.wgt || 1));
      if (big) r = Math.max(r, 5.5);
      els.push(h("circle", { key: "bn" + i, onPointerDown: e => this.dragStart(e, "n:" + n.id), cx: n.px, cy: n.py, r, fill: (big || n.gen <= 2) ? CAT[n.cat] : "#64748b", fillOpacity: big ? 1 : (n.gen <= 2 ? 0.95 : 0.6), stroke: big ? "#fff" : "#0f172a", strokeWidth: big ? 1.5 : 0.8, opacity: o, style: { cursor: "grab" } }));
    });
    // root labels
    const baseT = { fontFamily: "ui-monospace,Menlo,monospace", paintOrder: "stroke", stroke: "#0f172a", strokeLinejoin: "round" };
    // ---- root labels: show EVERY skill as tidy horizontal text, stacked so none overlap ----
    const showSub = this.props.showSubskillLabels !== false;
    const L = [];
    bNodes.forEach((n, i) => {
      const showHi = onB(n), anc = ancSet.has(n);
      if (actSet && !(showHi || anc)) return;          // when focused, only the used chain
      if (!actSet && !showSub && n.gen >= 3) return;    // tweak: hide deep leaves
      const fs = n.gen === 1 ? 17 : n.gen === 2 ? 11 : 9;
      const side = n.px < cx ? -1 : 1;                 // labels sit to the outer side of each node
      const tw = n.name.length * fs * 0.6, th = fs * 1.15;
      const pad = 7 + (n.gen === 1 ? 5 : 0);
      const anchorX = n.px + side * pad;
      const fill = n.gen === 1 ? CAT[n.cat] : (showHi ? CAT[n.cat] : (n.gen === 2 ? "#cbd5e1" : "#8ea2bf"));
      const op = actSet ? (showHi ? 1 : 0.5) : 1;
      L.push({ i, n, fs, tw, side, fill, op, showHi, hx: tw / 2 + 3, hy: th / 2 + 3,
        cx: anchorX + side * tw / 2, cy: n.py, nodeX: n.px, nodeY: n.py });
    });
    // declutter by stacking vertically → tidy columns on each side
    for (let it = 0; it < 420; it++) {
      let moved = false;
      for (let a = 0; a < L.length; a++) for (let b = a + 1; b < L.length; b++) {
        const A = L[a], B = L[b], dx = B.cx - A.cx, dy = B.cy - A.cy;
        const ox = (A.hx + B.hx) - Math.abs(dx), oy = (A.hy + B.hy) - Math.abs(dy);
        if (ox > 0 && oy > 0) { moved = true; const s = (dy < 0 ? -1 : 1) * (oy / 2 + 0.75); A.cy -= s; B.cy += s; }
      }
      if (!moved) break;
    }
    // deterministic finishing sweep: within each side, enforce minimum vertical pitch
    const clampT = groundY + 16, clampB = H - 3;
    L.forEach(o => { o.cy = Math.max(clampT + o.hy, Math.min(clampB - o.hy, o.cy)); });
    [-1, 1].forEach(sd => {
      const col = L.filter(o => o.side === sd).sort((a, b) => a.cy - b.cy);
      const share = (A, B) => Math.abs(B.cx - A.cx) < A.hx + B.hx;
      for (let i = 1; i < col.length; i++) {                  // push down past EVERY earlier label it shares a band with
        const B = col[i];
        for (let j = 0; j < i; j++) {
          const A = col[j];
          if (share(A, B)) { const need = A.hy + B.hy + 0.6; if (Math.abs(B.cy - A.cy) < need) B.cy = A.cy + need; }
        }
      }
      for (let i = col.length - 1; i > 0; i--) {              // pull back up off the bottom edge
        const B = col[i];
        if (B.cy + B.hy > clampB) B.cy = clampB - B.hy;
        for (let j = i - 1; j >= 0; j--) {
          const A = col[j];
          if (share(A, B)) { const need = A.hy + B.hy + 0.6; if (B.cy - A.cy < need && B.cy - A.cy > -need) A.cy = B.cy - need; }
        }
      }
    });
    // final passes: resolve vertically, then nudge un-resolvable pairs sideways, and repeat
    for (let round = 0; round < 5; round++) {
      L.forEach(o => {                                        // solve inside the real page bounds
        o.cy = Math.max(groundY + 14 + o.hy, Math.min(H - o.hy - 3, o.cy));
        o.cx = Math.max(o.hx + 3, Math.min(W - o.hx - 3, o.cx));
      });
      for (let it = 0; it < 90; it++) {
        let moved = false;
        for (let a = 0; a < L.length; a++) for (let b = a + 1; b < L.length; b++) {
          const A = L[a], B = L[b], dx = B.cx - A.cx, dy = B.cy - A.cy;
          const ox = (A.hx + B.hx) - Math.abs(dx), oy = (A.hy + B.hy) - Math.abs(dy);
          if (ox > 0 && oy > 0) { moved = true; const s = (dy < 0 ? -1 : 1) * (oy / 2 + 0.7); A.cy -= s; B.cy += s; }
        }
        if (!moved) break;
      }
      let stuck = false;
      for (let a = 0; a < L.length; a++) for (let b = a + 1; b < L.length; b++) {
        const A = L[a], B = L[b];
        const ox = (A.hx + B.hx) - Math.abs(B.cx - A.cx), oy = (A.hy + B.hy) - Math.abs(B.cy - A.cy);
        if (ox > 0 && oy > 0) {                       // pinned: move the shorter label out of the band
          stuck = true;
          const S = A.tw <= B.tw ? A : B, O = S === A ? B : A;
          S.cx += (S.cx <= O.cx ? -1 : 1) * (ox + 2);
        }
      }
      if (!stuck) break;
    }
    L.forEach(o => {
      const tx = o.cx - o.side * o.tw / 2, ty = o.cy;
      if (Math.hypot(tx - o.nodeX, ty - o.nodeY) > 13) els.push(h("path", { key: "ld" + o.i, d: `M${o.nodeX},${o.nodeY}Q${(o.nodeX + tx) / 2},${o.nodeY} ${tx},${ty}`, stroke: "#334155", strokeWidth: 0.6, strokeOpacity: 0.5 * o.op, fill: "none" }));
      els.push(h("text", { ...baseT, key: "bt" + o.i, x: tx, y: ty, dy: "0.32em", textAnchor: o.side < 0 ? "end" : "start", fontSize: o.showHi ? o.fs + 1 : o.fs, fontWeight: o.n.gen === 1 ? 700 : (o.showHi ? 700 : o.n.gen === 2 ? 600 : 500), fill: o.fill, strokeWidth: o.n.gen === 1 ? 4 : 2.4, opacity: o.op }, o.n.name));
    });

    // branches + brief cards
    briefs.forEach((b, i) => {
      const pj = PROJECTS[b.id], color = ERA[this.eraOf(b.id)], active = sel === b.id, dimC = sel && !active;
      const dir = b.left ? -1 : 1, bx = cx + dir * 3, baseY = b.baseY;
      // land exactly on the ellipse perimeter, on the side facing the trunk foot
      const vx = (cx + dir * 6) - b.tipX, vy = baseY - b.tipY;
      const th = Math.atan2(vy / b.ery, vx / b.erx);
      const ex = b.tipX + b.erx * Math.cos(th), ey = b.tipY + b.ery * Math.sin(th);
      // bough sweeps up and out in one long arc, as drawn
      const c1x = cx + dir * 10, c1y = baseY - (baseY - ey) * 0.72;
      const c2x = cx + dir * (Math.abs(ex - cx) * 0.42), c2y = ey - 6;
      const bw = 1.5 + b.imp * 0.13;
      const bd = `M${bx},${baseY} C${c1x},${c1y} ${c2x},${c2y} ${ex},${ey}`;
      els.push(h("path", { key: "br" + i, d: bd, stroke: active ? color : "#7c8ba5", strokeOpacity: dimC ? 0.18 : (active ? 0.95 : 0.8), strokeWidth: active ? bw + 1 : bw, fill: "none", strokeLinecap: "round" }));
      // the oval bubble that holds the brief
      els.push(h("ellipse", { key: "ov" + i, cx: b.tipX, cy: b.tipY, rx: b.erx, ry: b.ery, fill: active ? `${color}1a` : "#141f33", stroke: active ? color : "#48566e", strokeWidth: active ? 2 : 1.3, opacity: dimC ? 0.35 : 1 }));

      const card = h("div", {
        onPointerDown: e => this.dragStart(e, "c:" + b.id),
        onClick: e => { e.stopPropagation(); if (this._didDrag) { this._didDrag = false; return; } this.setState(s => ({ selected: s.selected === b.id ? null : b.id })); },
        style: { boxSizing: "border-box", width: (b.erx * 1.2) + "px", height: (b.ery * 1.45) + "px", display: "flex", flexDirection: "column", gap: "2px", alignItems: "center", justifyContent: "center", textAlign: "center",
          fontFamily: "system-ui,-apple-system,sans-serif", overflow: "hidden",
          opacity: dimC ? 0.4 : 1, transition: "opacity .15s", touchAction: "none", cursor: "grab" }
      },
        h("div", { style: { display: "flex", alignItems: "baseline", gap: "5px", justifyContent: "center", flexWrap: "wrap", maxWidth: (b.erx * 1.14) + "px" } },
          h("span", { style: { font: `700 ${pj.name.length > 15 ? 13 : 15}px system-ui`, color: active ? "#fff" : "#f1f5f9", lineHeight: 1.15 } }, pj.name),
          h("span", { style: { font: "700 11px ui-monospace,Menlo,monospace", color, whiteSpace: "nowrap" } }, pj.year)
        ),
        h("div", { style: { font: "400 11px/1.3 system-ui", color: "#cbd5e1", textWrap: "pretty", padding: "0 2px" } }, pj.desc),
        h("div", { style: { font: "600 10.5px/1.28 system-ui", color: "#a7f3d0", padding: "0 2px" } }, `\u2713 ${pj.result}`)
      );
      els.push(h("foreignObject", { key: "fo" + i, x: b.tipX - b.erx * 0.6, y: b.tipY - b.ery * 0.725, width: b.erx * 1.2, height: b.ery * 1.45, style: { overflow: "visible" } }, card));
    });

    // ---------- manual editor: position registry, custom links + nodes ----------
    this._pos = {};
    bNodes.forEach(n => { this._pos["n:" + n.id] = { x: n.px, y: n.py, label: n.name || n.id }; });
    briefs.forEach(b => { this._pos["c:" + b.id] = { x: b.tipX, y: b.tipY, label: PROJECTS[b.id].name }; });
    const cnodes = (this.state.custom.nodes || []).map(n => {
      const d = (this.state.drag || {})["u:" + n.id] || { dx: 0, dy: 0 };
      return { ...n, px: n.x + d.dx, py: n.y + d.dy };
    });
    cnodes.forEach(n => { this._pos["u:" + n.id] = { x: n.px, y: n.py, label: n.name }; });

    (this.state.custom.links || []).forEach((l, i) => {
      const a = this._pos[l.a], b2 = this._pos[l.b];
      if (!a || !b2) return;
      const mx = (a.x + b2.x) / 2;
      els.push(h("path", { key: "cl" + i, d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b2.y} ${b2.x},${b2.y}`,
        stroke: "#f0abfc", strokeWidth: 1.6, strokeOpacity: 0.85, fill: "none", strokeLinecap: "round", strokeDasharray: "5 4" }));
      els.push(h("path", { key: "clh" + i, d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b2.y} ${b2.x},${b2.y}`,
        stroke: "transparent", strokeWidth: 12, fill: "none", style: { cursor: "pointer" },
        onClick: e => { e.stopPropagation(); this.delLink(i); } }));
    });
    cnodes.forEach((n, i) => {
      const isFrom = this.state.linkFrom === "u:" + n.id;
      els.push(h("circle", { key: "cn" + i, cx: n.px, cy: n.py, r: 6, fill: CAT[n.cat] || "#f0abfc",
        stroke: isFrom ? "#fff" : "#0f172a", strokeWidth: 2, style: { cursor: "grab" },
        onPointerDown: e => this.dragStart(e, "u:" + n.id) }));
      els.push(h("text", { ...baseT, key: "cnt" + i, x: n.px + 10, y: n.py, dy: "0.32em",
        fontSize: 10, fontWeight: 700, fill: "#f5d0fe", strokeWidth: 2.6 }, n.name));
    });
    if (this.state.mode === "link" && this.state.linkFrom && this._pos[this.state.linkFrom]) {
      const p = this._pos[this.state.linkFrom];
      els.push(h("circle", { key: "lf", cx: p.x, cy: p.y, r: 11, fill: "none", stroke: "#f0abfc", strokeWidth: 1.6, strokeDasharray: "3 3" }));
    }

    // per-link style picker menu
    const menu = this.state.menu;
    if (menu) {
      const cur = (this.state.linkStyle || {})[menu.id] || (this.props.rootStyle || "curved");
      const opts = [["curved", "曲線 Curved"], ["straight", "直線 Straight"], ["stepped", "階梯 Stepped"]];
      const mw = 132, mh = 30 + opts.length * 26, mx = Math.max(6, Math.min(W - mw - 6, menu.x - mw / 2)), my = Math.max(6, Math.min(H - mh - 6, menu.y + 8));
      els.push(h("foreignObject", { key: "menu", x: mx, y: my, width: mw, height: mh, style: { overflow: "visible" } },
        h("div", { onClick: e => e.stopPropagation(), style: { fontFamily: "ui-monospace,Menlo,monospace", background: "#0b1220", border: "1px solid #334155", borderRadius: "8px", padding: "6px", boxShadow: "0 8px 24px rgba(0,0,0,.5)" } },
          h("div", { style: { font: "700 9px ui-monospace", color: "#64748b", letterSpacing: ".08em", padding: "2px 4px 5px" } }, "LINE STYLE"),
          ...opts.map(([v, lbl]) => h("div", { key: v, onClick: e => { e.stopPropagation(); this.setLinkStyle(menu.id, v); },
            style: { display: "flex", alignItems: "center", gap: "6px", cursor: "pointer", padding: "4px 6px", borderRadius: "5px", font: "600 10px system-ui", color: v === cur ? "#38bdf8" : "#cbd5e1", background: v === cur ? "rgba(56,189,248,.12)" : "transparent" } },
            h("span", { style: { width: "10px" } }, v === cur ? "✓" : ""), lbl))
        )
      ));
    }

    return h("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: "100%", preserveAspectRatio: "xMidYMid meet",
      onClick: e => this.canvasClick(e),
      onPointerMove: e => this.dragMove(e), onPointerUp: () => this.dragEnd(), onPointerLeave: () => this.dragEnd(),
      style: { display: "block", touchAction: "none" } }, ...els);
  }

  renderVals() {
    return {
      viz: this.buildViz(),
      outlineOpen: this.state.outlineOpen,
      toggleOutline: () => this.setState(s => ({ outlineOpen: !s.outlineOpen })),
      outlineText: this.outlineText(),
      onOutline: e => this.setOutline(e.target.value),
      resetOutline: () => { try { localStorage.removeItem("resumeTreeOutlineV1"); } catch (e) {} this.setState({ outline: null }); },
      rows: this.outlineLines().map(l => ({
        i: l.i, name: l.name, depth: l.depth,
        pad: (8 + l.depth * 15) + "px",
        color: ["#f0abfc", "#7dd3fc", "#a7f3d0", "#fde68a", "#cbd5e1", "#94a3b8"][Math.min(l.depth, 5)],

        out: () => this.shiftLine(l.i, -1), inn: () => this.shiftLine(l.i, 1),
        up: () => this.moveLine(l.i, -1), down: () => this.moveLine(l.i, 1),
        child: () => this.addChildOf(l.i), sib: () => this.addLineAfter(l.i),
        del: () => this.delLine(l.i)
      })),
      depthChips: [1, 2, 3, 4, 5, 99].map(d => ({
        d, label: d === 99 ? "全部" : "L" + d,
        onPick: () => this.setState({ maxDepth: d }),
        bg: this.state.maxDepth === d ? "#f0abfc" : "#0f172a",
        fg: this.state.maxDepth === d ? "#0b1220" : "#94a3b8"
      })),
      nodeCount: this.outlineLines().length,
      panelOpen: this.state.panelOpen,
      togglePanel: () => this.setState(s => ({ panelOpen: !s.panelOpen, mode: null, linkFrom: null })),
      mode: this.state.mode,
      modeHint: this.state.mode === "add" ? "點畫面任一處放置節點" : this.state.mode === "link" ? (this.state.linkFrom ? "再點第二個節點完成連線（" + this.labelOf(this.state.linkFrom) + "）" : "點靠近第一個節點") : "選擇模式後在畫面上操作",
      addOn: this.state.mode === "add", linkOn: this.state.mode === "link",
      setAdd: () => this.setState(s => ({ mode: s.mode === "add" ? null : "add", linkFrom: null })),
      setLink: () => this.setState(s => ({ mode: s.mode === "link" ? null : "link", linkFrom: null })),

      newCat: this.state.newCat,

      cats: Object.keys(CAT),

      uLinks: (this.state.custom.links || []).map((l, i) => ({ i, text: this.labelOf(l.a) + " → " + this.labelOf(l.b), del: () => this.delLink(i) })),
      clearAll: () => this.clearCustom(),
      hasSel: !!this.state.selected,
      hasDrag: Object.keys(this.state.drag || {}).length > 0,
      clearSel: () => this.setState({ selected: null }),
      resetPos: () => this.resetPositions(),
      doPrint: () => window.print(),
      onWheel: e => this.onWheel(e),
      onPanStart: e => this.onPanStart(e),
      onPanMove: e => this.onPanMove(e),
      onPanEnd: () => this.onPanEnd(),
      zoomIn: () => this.setZoom(this.state.zoom * 1.15),
      zoomOut: () => this.setZoom(this.state.zoom / 1.15),
      zoomReset: () => this.setState({ zoom: 1, panX: 0, panY: 0 }),
      zoomPct: Math.round(this.state.zoom * 100) + "%",
      vpStyle: `width:100%;flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:8px 0;touch-action:none;cursor:${this._pan ? "grabbing" : "grab"}`,
      fitStyle: (() => { const f = this.state.printing ? 1 : (this.state.fit || 1); return `flex:none;zoom:${f};transform:translate(${this.state.panX}px,${this.state.panY}px) scale(${this.state.zoom});transform-origin:center center;transition:${this._pan ? "none" : "transform .08s"}`; })(),
      containerStyle: `background:#0f172a;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6);border-radius:3px;width:760px;height:1050px`
    };
  }
}
</script>
