    briefs.forEach(b => { this._pos["c:" + b.id] = { x: b.tipX, y: b.tipY, label: PROJECTS[b.id].name }; });
    const cnodes = (this.state.custom.nodes || []).map(n => {
      const d = (this.state.drag || {})["u:" + n.id] || { dx: 0, dy: 0 };
      return { ...n, px: n.x + d.dx, py: n.y + d.dy };
    });
    cnodes.forEach(n => { this._pos["u:" + n.id] = { x: n.px, y: n.py, label: n.name }; });

    (this.state.custom.links || []).forEach((l, i) => {
      const a = this._pos[l.a], b2 = this._pos[l.b];
      if (!a || !b2) return;
      const mx = (a.x + b2.x) / 2;
      els.push(h("path", { key: "cl" + i, d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b2.y} ${b2.x},${b2.y}`,
        stroke: "#f0abfc", strokeWidth: 1.6, strokeOpacity: 0.85, fill: "none", strokeLinecap: "round", strokeDasharray: "5 4" }));
      els.push(h("path", { key: "clh" + i, d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b2.y} ${b2.x},${b2.y}`,
        stroke: "transparent", strokeWidth: 12, fill: "none", style: { cursor: "pointer" },
        onClick: e => { e.stopPropagation(); this.delLink(i); } }));
    });
    cnodes.forEach((n, i) => {
      const isFrom = this.state.linkFrom === "u:" + n.id;
      els.push(h("circle", { key: "cn" + i, cx: n.px, cy: n.py, r: 6, fill: CAT[n.cat] || "#f0abfc",
        stroke: isFrom ? "#fff" : "#0f172a", strokeWidth: 2, style: { cursor: "grab" },
        onPointerDown: e => this.dragStart(e, "u:" + n.id) }));
      els.push(h("text", { ...baseT, key: "cnt" + i, x: n.px + 10, y: n.py, dy: "0.32em",
        fontSize: 10, fontWeight: 700, fill: "#f5d0fe", strokeWidth: 2.6 }, n.name));
    });
    if (this.state.mode === "link" && this.state.linkFrom && this._pos[this.state.linkFrom]) {
      const p = this._pos[this.state.linkFrom];
      els.push(h("circle", { key: "lf", cx: p.x, cy: p.y, r: 11, fill: "none", stroke: "#f0abfc", strokeWidth: 1.6, strokeDasharray: "3 3" }));
    }

    // per-link style picker menu
    const menu = this.state.menu;
    if (menu && !printing) {
      const cur = (this.state.linkStyle || {})[menu.id] || (this.props.rootStyle || "straight");
      const opts = [["curved", "曲線 Curved"], ["straight", "直線 Straight"], ["stepped", "階梯 Stepped"]];
      const mw = 132, mh = 30 + opts.length * 26, mx = Math.max(6, Math.min(W - mw - 6, menu.x - mw / 2)), my = Math.max(6, Math.min(H - mh - 6, menu.y + 8));
      els.push(h("foreignObject", { key: "menu", x: mx, y: my, width: mw, height: mh, style: { overflow: "visible" } },
        h("div", { className: "branch-menu", onClick: e => e.stopPropagation(), style: { fontFamily: "ui-monospace,Menlo,monospace", background: "#0b1220", border: "1px solid #334155", borderRadius: "8px", padding: "6px", boxShadow: "0 8px 24px rgba(0,0,0,.5)" } },
          h("div", { style: { font: "700 9px ui-monospace", color: "#64748b", letterSpacing: ".08em", padding: "2px 4px 5px" } }, "LINE STYLE"),
          ...opts.map(([v, lbl]) => h("button", { type: "button", key: v, onClick: e => { e.stopPropagation(); this.setLinkStyle(menu.id, v); },
            style: { display: "flex", width: "100%", border: 0, alignItems: "center", gap: "6px", cursor: "pointer", padding: "4px 6px", borderRadius: "5px", font: "600 10px system-ui", color: v === cur ? "#38bdf8" : "#cbd5e1", background: v === cur ? "rgba(56,189,248,.12)" : "transparent" } },
            h("span", { style: { width: "10px" } }, v === cur ? "✓" : ""), lbl))
        )
      ));
    }


    return h('svg', { id: 'treeSvg', viewBox: `0 0 ${W} ${H}`, width: '100%', height: '100%', preserveAspectRatio: 'xMidYMid meet', onClick: e => this.canvasClick(e), onPointerMove: e => this.dragMove(e), onPointerUp: () => this.dragEnd(), onPointerLeave: () => this.dragEnd(), style: { display: 'block', touchAction: 'none' } }, ...els);
  }

  allSkillIds() { const ids = new Set(); (function walk(n) { if (n.id) ids.add(n.id); (n.children || []).forEach(walk); })(SKILL_DATA); return ids; }
  persistProjects() { const out = {}; Object.keys(PROJECTS).forEach(id => { const p = PROJECTS[id], d = PROJECT_DEFAULTS[id]; if (["name","year","desc","result","activeSkills"].some(k => JSON.stringify(p[k]) !== JSON.stringify(d[k]))) out[id] = { name:p.name, year:p.year, desc:p.desc, result:p.result, activeSkills:p.activeSkills }; }); try { localStorage.setItem("resumeTreeProjectsV1", JSON.stringify(out)); } catch (e) {} }
  updateProject(id, field, value) { if (!PROJECTS[id]) return; if (field === "activeSkills") { const known = this.allSkillIds(); value = [...new Set(String(value).split(/[,\s]+/).filter(x => known.has(x)))]; } PROJECTS[id][field] = value; this.persistProjects(); this.setState(s => ({ projectTick: s.projectTick + 1 })); }
  resetProject(id) { if (!PROJECTS[id] || !PROJECT_DEFAULTS[id]) return; Object.assign(PROJECTS[id], JSON.parse(JSON.stringify(PROJECT_DEFAULTS[id]))); this.persistProjects(); this.setState(s => ({ projectTick: s.projectTick + 1 })); }
  exportResume() { const payload = { version: 2, exportedAt: new Date().toISOString(), skills: this.tree(), projects: PROJECTS, editor: { outline: this.state.outline, drag: this.state.drag, linkStyle: this.state.linkStyle, custom: this.state.custom } }; const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = "resume-tree-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(url), 0); }
  renderVals() {
    return {
      viz: this.buildViz(),
      exportResume: () => this.exportResume(),
      projectPanelOpen: this.state.projectPanelOpen,
      toggleProjectPanel: () => this.setState(s => ({ projectPanelOpen: !s.projectPanelOpen })),
      projectOptions: Object.keys(PROJECTS).map(id => ({ id, label: PROJECTS[id].year + " - " + PROJECTS[id].name })),
      selectedProjectId: PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0],
      pickProject: e => this.setState({ selected: e.target.value }),
      projectEdit: PROJECTS[PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0]],
      projectSkillsText: (PROJECTS[PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0]].activeSkills || []).join(", "),
      onProjectName: e => this.updateProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0], "name", e.target.value),
      onProjectYear: e => this.updateProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0], "year", e.target.value),
      onProjectDesc: e => this.updateProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0], "desc", e.target.value),
      onProjectResult: e => this.updateProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0], "result", e.target.value),
      onProjectSkills: e => this.updateProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0], "activeSkills", e.target.value),
      resetProject: () => this.resetProject(PROJECTS[this.state.selected] ? this.state.selected : Object.keys(PROJECTS)[0]),
      outlineOpen: this.state.outlineOpen,
      toggleOutline: () => this.setState(s => ({ outlineOpen: !s.outlineOpen })),
      outlineText: this.outlineText(),
      onOutline: e => this.setOutline(e.target.value),
      resetOutline: () => { try { localStorage.removeItem("resumeTreeOutlineV2"); } catch (e) {} this.setState({ outline: null }); },
      rows: this.outlineLines().map(l => ({
        i: l.i, name: l.name, depth: l.depth,
        pad: (8 + l.depth * 15) + "px",
        color: ["#f0abfc", "#7dd3fc", "#a7f3d0", "#fde68a", "#cbd5e1", "#94a3b8"][Math.min(l.depth, 5)],
        size: l.depth === 0 ? "12.5px" : l.depth === 1 ? "11.5px" : "11px",
        weight: l.depth <= 1 ? 700 : 500,
        onEdit: e => this.renameLine(l.i, e.target.value),
        out: () => this.shiftLine(l.i, -1), inn: () => this.shiftLine(l.i, 1),
        up: () => this.moveLine(l.i, -1), down: () => this.moveLine(l.i, 1),
        child: () => this.addChildOf(l.i), sib: () => this.addLineAfter(l.i),
        del: () => this.delLine(l.i)
      })),
      depthChips: [1, 2, 3, 4, 5, 99].map(d => ({
        d, label: d === 99 ? "全部" : "L" + d,
        onPick: () => this.setState({ maxDepth: d }),
        bg: this.state.maxDepth === d ? "#f0abfc" : "#0f172a",
        fg: this.state.maxDepth === d ? "#0b1220" : "#94a3b8"
      })),
      nodeCount: this.outlineLines().length,
      panelOpen: this.state.panelOpen,
      togglePanel: () => this.setState(s => ({ panelOpen: !s.panelOpen, mode: null, linkFrom: null })),
      mode: this.state.mode,
      modeHint: this.state.mode === "add" ? "點畫面任一處放置節點" : this.state.mode === "link" ? (this.state.linkFrom ? "再點第二個節點完成連線（" + this.labelOf(this.state.linkFrom) + "）" : "點靠近第一個節點") : "選擇模式後在畫面上操作",
      addOn: this.state.mode === "add", linkOn: this.state.mode === "link",
      setAdd: () => this.setState(s => ({ mode: s.mode === "add" ? null : "add", linkFrom: null })),
      setLink: () => this.setState(s => ({ mode: s.mode === "link" ? null : "link", linkFrom: null })),
      newName: this.state.newName,
      onName: e => this.setState({ newName: e.target.value }),
      newCat: this.state.newCat,
      onCat: e => this.setState({ newCat: e.target.value }),
      cats: Object.keys(CAT),
      uNodes: (this.state.custom.nodes || []).map(n => ({ id: n.id, name: n.name, color: CAT[n.cat] || "#f0abfc", del: () => this.delNode(n.id) })),
      uLinks: (this.state.custom.links || []).map((l, i) => ({ i, text: this.labelOf(l.a) + " → " + this.labelOf(l.b), del: () => this.delLink(i) })),
      clearAll: () => this.clearCustom(),
      hasSel: !!this.state.selected,
      hasDrag: Object.keys(this.state.drag || {}).length > 0,
      clearSel: () => this.setState({ selected: null }),
      resetPos: () => this.resetPositions(),
      doPrint: () => window.print(),
      onWheel: e => this.onWheel(e),
      onPanStart: e => this.onPanStart(e),
      onPanMove: e => this.onPanMove(e),
      onPanEnd: () => this.onPanEnd(),
      zoomIn: () => this.setZoom(this.state.zoom * 1.15),
      zoomOut: () => this.setZoom(this.state.zoom / 1.15),
      zoomReset: () => this.setState({ zoom: 1, panX: 0, panY: 0 }),
      zoomPct: Math.round(this.state.zoom * 100) + "%",
      vpStyle: `width:100%;flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:8px 0;touch-action:none;cursor:${this._pan ? "grabbing" : "grab"}`,
      fitStyle: (() => { const f = this.state.printing ? 1 : (this.state.fit || 1); return `flex:none;zoom:${f};transform:translate(${this.state.panX}px,${this.state.panY}px) scale(${this.state.zoom});transform-origin:center center;transition:${this._pan ? "none" : "transform .08s"}`; })(),
      containerStyle: `background:#0f172a;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6);border-radius:3px;width:760px;height:1050px`
    };
  }
}
</script>
