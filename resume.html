    <style>
        :root {
            /* Screen Colors (Dark IDE Theme) */
            --bg-main: #0f172a;       /* Main Content (Deep Slate) */
            --bg-panel: #1e293b;      /* Header (Lighter Slate) */
            --bg-sidebar: #020617;    /* Sidebar (Darker/Black) */
            
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.15);
            
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --border: #334155;
            --code-bg: #020617;
            
            /* D3 Node Colors */
            --node-stroke: #4b5563;

            /* Fonts */
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000; /* Outer background for screen */
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh; /* Allow growth */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Enable page scrolling if needed */
            padding: 20px; /* Space for scrollbars */
        }

        /* --- A4 CONTAINER --- */
        #a4-container {
            width: 100%;
            max-width: 1400px; 
            aspect-ratio: 297/210; 
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            flex-shrink: 0; /* Prevent crushing */
        }

        /* --- HEADER --- */
        header {
            height: 15%; /* Increased slightly for contact info */
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 300px 250px 1fr; /* Name | Contact | Chart */
            padding: 0 30px;
            align-items: center;
            gap: 20px;
        }
        .profile h1 { font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 4px; color: #fff; }
        .profile .role { color: var(--accent); font-family: var(--font-mono); font-size: 0.85rem; }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-left: 1px solid var(--border);
            padding-left: 20px;
        }
        .contact-item { display: flex; align-items: center; gap: 8px; }
        .contact-item i { width: 16px; text-align: center; color: var(--accent); }
        .contact-item a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .contact-item a:hover { color: var(--text-main); }

        /* Bubble Chart Container */
        #bubble-chart-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
            gap: 15px;
        }
        
        #toggle-pdf-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        #toggle-pdf-btn:hover, #toggle-pdf-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- LAYOUT GRID --- */
        #workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 28% 1fr 0px; /* Timeline | Skills | Detail (Hidden by default) */
            overflow: hidden;
            transition: grid-template-columns 0.3s ease;
            position: relative; /* For overlay */
        }

        #workspace.pdf-open {
            grid-template-columns: 28% 1fr 28%;
        }

        /* --- COLUMN 1: TIMELINE (Compact & Collapsible) --- */
        #col-timeline {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 0; 
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Continuous Vertical Line */
        #col-timeline::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 25px; /* Centered in the 50px gutter */
            width: 2px;
            background: var(--border);
            z-index: 0;
        }

        .tl-group {
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 1;
            /* Indent the blocks to leave space for the timeline line */
            margin-left: 50px; 
            background: var(--bg-sidebar); 
        }
        
        /* Accordion Header */
        .tl-header {
            padding: 15px 15px 15px 15px; /* Reduced left padding as container is indented */
            cursor: pointer;
            background: var(--bg-sidebar);
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .tl-header:hover { background: var(--bg-panel); }
        
        /* Timeline Dot */
        .tl-header::before {
            content: '';
            position: absolute;
            /* Position relative to the header, pushing it left into the gutter */
            left: -31px; /* 25px (center of gutter) - 50px (margin) - 6px (half width) */
            top: 50%; transform: translateY(-50%);
            width: 12px; height: 12px;
            background: var(--bg-sidebar);
            border: 2px solid var(--accent);
            border-radius: 50%;
            z-index: 2;
        }
        .tl-group.expanded .tl-header::before { background: var(--accent); }
        
        .tl-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); display: block; }
        .tl-title { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 2px; }
        .tl-arrow { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
        .tl-group.expanded .tl-arrow { transform: rotate(180deg); }

        /* Accordion Content */
        .tl-body {
            display: none;
            background: rgba(255,255,255,0.03); /* Slight lighten for contrast against dark sidebar */
            padding: 10px 15px 20px 15px;
            border-top: 1px solid var(--border);
        }
        .tl-group.expanded .tl-body { display: block; }
        
        .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; padding: 0 5px; }

        /* Compact Project List */
        .project-list { display: flex; flex-direction: column; gap: 6px; }
        
        .project-btn {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; 
            padding: 8px 10px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .project-btn:hover { border-color: var(--accent); transform: translateX(2px); }
        .project-btn.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        
        .p-name { font-weight: 600; font-size: 0.85rem; color: #e2e8f0; }
        .p-tags { display: flex; gap: 4px; }
        .p-tag { 
            font-family: var(--font-mono); font-size: 0.6rem; color: #94a3b8; 
            background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 2px; 
        }

        /* --- COLUMN 2: SKILL NETWORK (D3 Container) --- */
        #col-nested {
            background-color: var(--bg-main);
            overflow: hidden; 
            padding: 0;
            position: relative;
        }

        .chart-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #chart-container:active {
            cursor: grabbing;
        }

        /* D3 Styles */
        .link {
            fill: none;
            stroke: #4b5563;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
            transition: stroke 0.5s, stroke-opacity 0.5s, d 0.5s;
        }
        .node circle {
            cursor: pointer;
            transition: fill 0.5s, stroke 0.5s, r 0.5s;
        }
        .node text {
            cursor: pointer;
            font-size: 14px;
            fill: var(--text-main);
            font-family: var(--font-mono); /* Use theme font */
            paint-order: stroke;
            stroke: var(--bg-main); /* Match background for halo */
            stroke-width: 3px;
            transition: fill 0.5s, font-weight 0.5s, x 0.5s, text-anchor 0.5s;
        }

        /* Highlights */
        .highlight circle {
            stroke: var(--accent);
            fill: var(--accent);
        }
        .highlight text {
            fill: #93c5fd;
            font-weight: 700;
        }
        .highlight-link {
            stroke: var(--accent);
            stroke-opacity: 1;
        }
        .converge-link {
            stroke: #f59e0b; /* Amber */
            stroke-opacity: 0;
            stroke-width: 2px;
            stroke-dasharray: 6 3;
            transition: stroke-opacity 0.5s, d 0.5s;
        }
        .dimmed {
            opacity: 0.2;
            transition: opacity 0.5s;
        }

        /* Controls */
        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }
        .zoom-controls button {
            width: auto;
            min-width: 30px;
            height: 30px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: bold;
            background-color: rgba(30, 41, 59, 0.9); /* --bg-panel */
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }
        .zoom-controls button:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* --- COLUMN 3: DETAIL (PDF EMBED) --- */
        #col-detail {
            background: var(--bg-sidebar); border-left: 1px solid var(--border);
            padding: 0; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #pdf-container {
            width: 100%;
            height: 100%;
            background: #333;
        }

        /* --- PRINT STYLES --- */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { 
                background: white; color: black; height: auto; display: block; overflow: visible;
                -webkit-print-color-adjust: exact;
            }
            #a4-container {
                width: 100%; aspect-ratio: auto; box-shadow: none; height: 100%;
                background: white; color: black; display: block;
            }
            
            /* Color Overrides */
            :root {
                --bg-main: #ffffff;
                --bg-panel: #f1f5f9;
                --bg-sidebar: #ffffff;
                --accent: #0284c7; /* Darker blue for print */
                --text-main: #000000;
                --text-muted: #475569;
                --border: #cbd5e1;
                --code-bg: #f8fafc;
                --folder-color: #000000;
                --file-color: #334155;
                --tree-hover: #ffffff;
                --tree-guide: #e2e8f0;
                --text-bubble-val: #000000;
                
                /* D3 Node Colors (Print) */
                --node-fill-collapsed: #000000;
                --node-fill-expanded: #ffffff;
                --node-stroke: #000000;
            }

            /* Layout Adjustments for Print */
            header { height: auto; padding: 20px 30px; border-bottom: 2px solid #000; }
            #workspace { display: grid; grid-template-columns: 25% 45% 30%; height: auto; overflow: visible; }
            
            #col-timeline, #col-nested, #col-detail { 
                overflow: visible; height: auto; border: none; background: white; 
            }
            
            #col-nested { border-left: 1px solid #eee; border-right: 1px solid #eee; }

            /* Tree Print Logic: Expand All or Show Flat */
            .tree-children { display: flex !important; margin-left: 10px; } /* Force expand */
            .t-icon { color: #000; }
            
            /* Hide Buttons */
            #reset-btn, .project-btn, .zoom-controls, #toggle-pdf-btn { display: none !important; }
            .project-btn:hover { transform: none; }
            .project-btn.active { background: #f0f0f0 !important; border-color: #000; box-shadow: none; }
            
            /* Ensure text is black */
            .profile h1, .profile .role { color: #000 !important; }
            .p-name, .tl-title, .detail-title, .detail-body p { color: #000 !important; }
            .tl-content { color: #333 !important; }
            .code-block { border: 1px solid #ccc; color: #333; }

            /* Force D3 Text to be black for print (Overrides inline D3 styles) */
            .node text { fill: #000000 !important; font-weight: bold !important; }
            
            /* Reset Interactions for Print */
            .tree-dimmed .tree-row { opacity: 1 !important; }
            .tree-highlight > .tree-row { color: #000 !important; font-weight: normal; }
        }

    </style>
</head>

        // ==========================================
        // 3. D3 HORIZONTAL TREE RENDERER & INTERACTION
        // ==========================================
        
        // Global interaction triggers
        let globalTriggerProjectSelect = null;
        let globalResetView = null;

        function drawHorizontalTree() {
            const container = d3.select('#chart-container');
            container.html(''); // Clear previous

            const width = container.node().clientWidth;
            const height = container.node().clientHeight;
            
            const margin = { top: 20, right: 120, bottom: 20, left: 100 };
            // Note: innerWidth/Height not strictly used for bidirectional nodeSize layout
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [0, 0, width, height])
                .style("font-family", "var(--font-mono)");
            
            const g = svg.append("g");
                // transform set by zoom

            // Split Data into Left and Right Sets for Independent Layouts
            const rightChildren = fullSkillData.children.filter(c => c.name === "Firmware");
            const leftChildren = fullSkillData.children.filter(c => c.name !== "Firmware");

            // Root Hierarchy - Right (Firmware)
            const rootR = d3.hierarchy({ ...fullSkillData, children: rightChildren });
            rootR.x0 = 0; rootR.y0 = 0; // Relative to center
            
            // Root Hierarchy - Left (Hardware, Digital Twins)
            const rootL = d3.hierarchy({ ...fullSkillData, children: leftChildren });
            rootL.x0 = 0; rootL.y0 = 0; // Relative to center

            // Sort logic
            // Right: Standard Sort
            rootR.sort((a, b) => d3.ascending(a.data.name, b.data.name));
            
            // Left: Custom Sort (Hardware above Digital Twins)
            rootL.sort((a, b) => {
                 if(a.depth === 1 && b.depth === 1) {
                     if(a.data.name === "Hardware") return -1;
                     if(b.data.name === "Hardware") return 1;
                 }
                 return d3.ascending(a.data.name, b.data.name);
            });

            // Layout Mode State
            let currentLayoutMode = 'split';

            function switchLayoutMode(mode) {
                if(mode === currentLayoutMode) return;
                currentLayoutMode = mode;

                if (mode === 'unified') {
                    // Unified: Move Left Nodes to Right Root
                    if (rootL.children) {
                        if (!rootR.children) rootR.children = [];
                        rootR.children.push(...rootL.children);
                        rootL.children = null;
                    }
                    // Sort Combined Tree (Firmware, Hardware, Digital Twins)
                    rootR.sort((a, b) => {
                         // Custom order if needed, or just alphabetical
                         // Let's put Hardware top, then Firmware, then Digital Twins?
                         // Or keep Firmware, Hardware, Digital Twins.
                         return d3.ascending(a.data.name, b.data.name);
                    });

                } else {
                    // Split: Restore original owners based on name
                    if (rootR.children) {
                         const allChildren = rootR.children;
                         const r = [];
                         const l = [];
                         allChildren.forEach(child => {
                             if (child.data.name === "Firmware") r.push(child);
                             else l.push(child);
                         });
                         rootR.children = r;
                         rootL.children = l;
                    }
                    // Re-sort Left
                     rootL.sort((a, b) => {
                         if(a.depth === 1 && b.depth === 1) {
                             if(a.data.name === "Hardware") return -1;
                             if(b.data.name === "Hardware") return 1;
                         }
                         return d3.ascending(a.data.name, b.data.name);
                    });
                }
                update(rootR);
            }

            // Tree Layout
            const tree = d3.tree().nodeSize([22, 160]);
            
            // Link generator
            const diagonal = d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x);

            // Level Styles
            const levelColors = ["#ffffff", "#38bdf8", "#a78bfa", "#34d399", "#94a3b8"];
            const levelSizes = [8, 8, 6, 5, 4];
            const levelFontSizes = ["18px", "16px", "14px", "13px", "12px"];
            const levelTextColors = ["#ffffff", "#38bdf8", "#f1f5f9", "#e2e8f0", "#cbd5e1"];
            
            // Groups
            const gLink = g.append("g").attr("fill", "none").attr("stroke", "#4b5563").attr("stroke-opacity", 0.4).attr("stroke-width", 1.5);
            const gNode = g.append("g").attr("cursor", "pointer").attr("pointer-events", "all");

            // Update Function (Collapsible)
            function update(source) {
                const duration = 250;
                
                // 1. Compute Layouts Independently (Centers them around 0,0)
                tree(rootR);
                tree(rootL);

                // 2. Adjustments based on Mode
                if (currentLayoutMode === 'split') {
                    // Post-Process Left Tree (Flip Y)
                    rootL.each(d => {
                        d.y = -d.y;
                        d.isLeft = true;
                    });

                    // GATHER CLOSER: Reduce horizontal spacing for Level 1
                    // Only for direct children of root (depth 1)
                    [rootL, rootR].forEach(r => {
                         if (r.children) {
                             r.children.forEach(child => {
                                 // Pull them closer to center (0).
                                 // Current y is calculated by tree (depth * default spacing).
                                 // We override it manually.
                                 // Note: child descendants are relative to child in d3.tree?
                                 // No, d3.tree computes absolute x,y from root.
                                 // If we move child, we must shift all its descendants by the same amount.

                                 const shift = child.y * 0.7; // Reduce distance by 70% (keep 30%)
                                 const deltaY = (child.y > 0 ? -shift : shift);

                                 child.each(d => {
                                     d.y += deltaY;
                                 });
                             });
                         }
                    });

                    // ALIGN TOPS:
                    // Shift Right Tree vertically so its highest point matches Left Tree's highest point.
                    let minXL = Infinity;
                    rootL.each(d => { if(d.x < minXL) minXL = d.x; });

                    let minXR = Infinity;
                    rootR.each(d => { if(d.x < minXR) minXR = d.x; });

                    // Only apply if both have valid content (avoid shifting if empty)
                    // Note: root nodes are at x=0. So mins are at least 0.
                    // Actually x can be negative in d3.tree (it centers parent).
                    if (minXL !== Infinity && minXR !== Infinity) {
                        const offset = minXL - minXR;
                        rootR.each(d => { d.x += offset; });
                    }

                } else {
                    // Unified Mode
                    // Everything is in rootR. No flipping needed.
                    rootR.each(d => {
                         d.isLeft = false;
                    });
                }

                rootR.each(d => {
                    if (currentLayoutMode === 'split') d.isLeft = false;
                });

                // 3. Merge Nodes & Links
                // We exclude rootL's root node from the visual array to avoid duplicate center circle
                // But we keep its links
                const nodesR = rootR.descendants();
                const nodesL = rootL.descendants().filter(d => d.depth > 0); 
                const nodes = [...nodesR, ...nodesL].reverse();
                
                const linksR = rootR.links();
                const linksL = rootL.links();
                const links = [...linksR, ...linksL];

                // Nodes
                const node = gNode.selectAll("g.node")
                    .data(nodes, d => d.id || (d.id = Math.random())); 

                const nodeEnter = node.enter().append("g")
                    .attr("class", "node")
                    .attr("transform", d => `translate(${source.y0},${source.x0})`)
                    .on("click", (event, d) => {
                        // Toggle children on click
                        if (d.children) {
                            d._children = d.children;
                            d.children = null;
                        } else {
                            d.children = d._children;
                            d._children = null;
                        }
                        update(d);
                    });

                // Add Circle
                nodeEnter.append("circle")
                    .attr("r", 0) 
                    .attr("fill", d => d._children ? "#0284c7" : (levelColors[d.depth] || "#94a3b8"))
                    .attr("stroke", "var(--node-stroke)")
                    .attr("stroke-width", 1.5);

                // Add Text (Initial)
                nodeEnter.append("text")
                    .attr("dy", "0.31em")
                    .text(d => d.depth === 0 ? "" : d.data.name) 
                    .style("fill-opacity", 0)
                    .style("font-size", d => levelFontSizes[d.depth] || "12px")
                    .style("fill", d => levelTextColors[d.depth] || "#cbd5e1")
                    .style("font-weight", d => d.depth <= 1 ? "bold" : "normal")
                    .clone(true).lower()
                    .attr("stroke", "var(--bg-main)")
                    .attr("stroke-width", 2); 

                // Transition nodes to their new position.
                const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                nodeUpdate.select("circle")
                    .attr("r", d => d.depth === 0 ? 0 : (levelSizes[d.depth] || 4))
                    .attr("fill", d => d._children ? "var(--accent)" : (levelColors[d.depth] || "#94a3b8"));

                // Dynamic Text Anchor based on side
                nodeUpdate.selectAll("text")
                    .attr("x", d => {
                        if (d.depth === 0) return 0;
                        return d.y < 0 ? -15 : 15;
                    })
                    .attr("text-anchor", d => {
                        if (d.depth === 0) return "middle";
                        return d.y < 0 ? "end" : "start";
                    })
                    .style("fill-opacity", 1);

                // Transition exiting nodes
                const nodeExit = node.exit().transition().duration(duration)
                    .attr("transform", d => `translate(${source.y},${source.x})`)
                    .remove();

                nodeExit.select("circle").attr("r", 0);
                nodeExit.selectAll("text").style("fill-opacity", 0);

                // Links
                const link = gLink.selectAll("path.link")
                    .data(links, d => d.target.id);

                const linkEnter = link.enter().append("path")
                    .attr("class", "link")
                    .attr("d", d => {
                        const o = {x: source.x0, y: source.y0};
                        return diagonal({source: o, target: o});
                    });

                // Update links - diagonal automatically uses the flipped d.y
                link.merge(linkEnter).transition().duration(duration)
                    .attr("d", diagonal);

                link.exit().transition().duration(duration)
                    .attr("d", d => {
                        const o = {x: source.x, y: source.y};
                        return diagonal({source: o, target: o});
                    })
                    .remove();

                // Stash the old positions for transition.
                nodes.forEach(d => {
                    d.x0 = d.x;
                    d.y0 = d.y;
                });
            }

            // Initial Update
            update(rootR);
            
            // Zoom Support
            // Current Transform Tracker
            let currentTransform = d3.zoomIdentity.translate(width/2, height/2);

            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on("zoom", (event) => {
                    currentTransform = event.transform;
                    g.attr("transform", event.transform);
                    // Clear overlay lines on zoom to avoid mismatch
                });
            
            // Center Initial View (width/2, height/2)
            svg.call(zoom).call(zoom.transform, currentTransform);


            // ==========================================
            // INTERACTION LOGIC (Scoped to instance)
            // ==========================================
            
            // Reset
            window.globalResetView = () => {
                 switchLayoutMode('split');

                 // Expand all
                 [rootL, rootR].forEach(r => {
                     r.descendants().forEach(d => {
                         if (d._children) {
                             d.children = d._children;
                             d._children = null;
                         }
                     });
                 });
                 update(rootR); // Source doesn't matter much for reset
                 
                 // Reset Zoom
                 svg.transition().duration(750)
                    .call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2));
                 
                 // Clear highlights
                 gNode.selectAll("circle").transition().style("opacity", 1).attr("fill", d => levelColors[d.depth] || "#94a3b8");
                 gNode.selectAll("text").transition().style("opacity", 1).style("fill", d => levelTextColors[d.depth] || "#94a3b8");
                 gLink.selectAll("path").transition().style("opacity", 1).attr("stroke", "#4b5563");
            };

            // Highlight Project
            window.globalTriggerProjectSelect = (projectName, btnID) => {
                const project = Object.values(projectsDB).find(p => p.name === projectName);
                if (!project) return;

                switchLayoutMode('unified');

                // 1. Expand relevant paths first
                const activeIDs = new Set(project.activeSkills || []);
                let targets = [];
                
                // Helper to check both trees (Note: In unified mode, all are in rootR, but referencing rootL is harmless if empty)
                [rootL, rootR].forEach(r => {
                    r.each(d => {
                        if (d.data.id && activeIDs.has(d.data.id)) {
                            targets.push(d);
                        }
                    });
                });
                
                targets.forEach(d => {
                    let curr = d;
                    while (curr.parent) {
                        if (curr.parent._children) {
                            curr.parent.children = curr.parent._children;
                            curr.parent._children = null;
                        }
                        curr = curr.parent;
                    }
                });
                
                update(rootR);

                // 2. Apply Highlighting & Draw Lines
                setTimeout(() => {
                    const activeNodes = new Set();
                    const targetSet = new Set();
                    
                    [rootL, rootR].forEach(r => {
                         r.each(d => {
                            if (d.data.id && activeIDs.has(d.data.id)) {
                                targetSet.add(d);
                                let curr = d;
                                while(curr) {
                                    activeNodes.add(curr);
                                    curr = curr.parent;
                                }
                            }
                        });
                    });

                    // Dim others
                    gNode.selectAll("g.node").transition().duration(500)
                        .style("opacity", d => activeNodes.has(d) ? 1 : 0.1);

                    gLink.selectAll("path.link").transition().duration(500)
                        .style("opacity", d => activeNodes.has(d.target) ? 1 : 0.1)
                        .attr("stroke", d => activeNodes.has(d.target) ? "var(--accent)" : "#4b5563");
                    
                    // Highlight active
                    gNode.selectAll("circle")
                        .transition().duration(500)
                        .attr("fill", d => targetSet.has(d) ? "var(--accent)" : (d.children ? (levelColors[d.depth] || "#94a3b8") : (levelColors[d.depth] || "#94a3b8")))
                        .attr("r", d => d.depth === 0 ? 0 : (targetSet.has(d) ? 10 : (levelSizes[d.depth] || 4)));
                        
                    gNode.selectAll("text")
                         .transition().duration(500)
                         .style("fill", d => activeNodes.has(d) ? "var(--accent)" : (levelTextColors[d.depth] || "#94a3b8"))
                         .style("font-weight", d => activeNodes.has(d) ? "bold" : (d.depth <=1 ? "bold" : "normal"));

                }, 300); // Wait for tree expansion
            };
            
            d3.select("#zoom-reset").on("click", window.globalResetView);
        }

        // Bridge function for Timeline
        function selectProject(pid) {
            // 1. Highlight Project Button (Timeline)
            document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
            const btnID = `btn-${pid}`;

        // ==========================================
        // 4. HEADER BUBBLE CHART
        // ==========================================
        function drawHeaderBubbles() {
            const container = d3.select("#bubble-chart-container");
            const width = 500; 
            const height = 130; 

            // 1. Process Data: Count leaves per top-level category
            const root = d3.hierarchy(fullSkillData);
            const categories = root.children.map(cat => {
                // Count all descendants for "weight"
                return {
                    name: cat.data.name,
                    value: cat.descendants().length
                };
            });
            
            const packData = { children: categories };
            const rootPack = d3.hierarchy(packData).sum(d => d.value);

            // 2. Layout
            const pack = d3.pack()
                .size([width, height])
                .padding(15);
            
            pack(rootPack);

            // 3. SVG
            const svg = container.insert("svg", ":first-child")
                .attr("width", width)
                .attr("height", height)
                .style("margin-right", "auto") // Push to left if we want, or keep centered
                .style("overflow", "visible");

            const nodes = svg.selectAll("g")
                .data(rootPack.children)
                .join("g")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            // Colors
            const colorMap = {
                "Firmware": "#38bdf8",     // Blue
                "Hardware": "#34d399",     // Green
                "Digital Twins": "#a78bfa" // Purple
            };

            // Bubble
            nodes.append("circle")
                .attr("r", d => d.r)
                .attr("fill", d => colorMap[d.data.name] || "#94a3b8")
                .attr("opacity", 0.15)
                .attr("stroke", d => colorMap[d.data.name] || "#94a3b8")
                .attr("stroke-width", 1.5)
                .style("cursor", "default");

            // Label (Name)
            nodes.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "-0.3em")
                .style("font-size", d => d.r < 35 ? "10px" : "12px")
                .style("fill", "#e2e8f0")
                .style("font-weight", "600")
                .style("font-family", "var(--font-mono)")
                .style("pointer-events", "none")
                .each(function(d) {
                    const el = d3.select(this);
                    const name = d.data.name;
                    // Split long names if bubble is small
                    if (name.includes(" ") && d.r < 40) {
                        const parts = name.split(" ");
                        el.append("tspan").attr("x", 0).attr("dy", "-0.2em").text(parts[0]);
                        el.append("tspan").attr("x", 0).attr("dy", "1.1em").text(parts[1]);
                    } else {
                        el.text(name);
                    }
                });
                
            // Label (Count/%)
            nodes.append("text")
                .text(d => Math.round((d.data.value / rootPack.value) * 100) + "%")
                .attr("text-anchor", "middle")
                .attr("dy", d => d.data.name.includes(" ") && d.r < 40 ? "2.3em" : "1.2em")
                .style("font-size", d => d.r < 35 ? "10px" : "11px")
                .style("fill", "var(--accent)")
                .style("pointer-events", "none");
        }

        // Init
        window.onload = () => {
            renderTimeline();
            drawHorizontalTree(); 
            drawHeaderBubbles();
        };


        function togglePDF() {
            const ws = document.getElementById('workspace');
            const btn = document.getElementById('toggle-pdf-btn');
            ws.classList.toggle('pdf-open');
            btn.classList.toggle('active');

            // Update button text
            const isPDFOpen = ws.classList.contains('pdf-open');
            btn.innerHTML = isPDFOpen ? '📄 Hide PDF' : '📄 PDF Viewer';
            
            // Resize chart after transition
            setTimeout(() => {
                // We need to trigger a redraw or resize event if D3 doesn't auto-handle it.
                // Re-running drawHorizontalTree() is the safest way to correct centering.
                drawHorizontalTree();
            }, 350);
        }

    </script>
</body>
</html>
