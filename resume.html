    <style>
        :root {
            /* Screen Colors (Dark IDE Theme) */
            --bg-main: #0f172a;       /* Main Content (Deep Slate) */
            --bg-panel: #1e293b;      /* Header (Lighter Slate) */
            --bg-sidebar: #020617;    /* Sidebar (Darker/Black) */
            
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.15);
            
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --border: #334155;
            --code-bg: #020617;
            
            /* D3 Node Colors */
            --node-stroke: #4b5563;

            /* Fonts */
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000; /* Outer background for screen */
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh; /* Allow growth */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Enable page scrolling if needed */
            padding: 20px; /* Space for scrollbars */
        }

        /* --- A4 CONTAINER --- */
        #a4-container {
            width: 100%;
            max-width: 1400px; 
            aspect-ratio: 297/210; 
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            flex-shrink: 0; /* Prevent crushing */
        }

        /* --- HEADER --- */
        header {
            height: 15%; /* Increased slightly for contact info */
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 300px 250px 1fr; /* Name | Contact | Chart */
            padding: 0 30px;
            align-items: center;
            gap: 20px;
        }
        .profile h1 { font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 4px; color: #fff; }
        .profile .role { color: var(--accent); font-family: var(--font-mono); font-size: 0.85rem; }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-left: 1px solid var(--border);
            padding-left: 20px;
        }
        .contact-item { display: flex; align-items: center; gap: 8px; }
        .contact-item i { width: 16px; text-align: center; color: var(--accent); }
        .contact-item a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .contact-item a:hover { color: var(--text-main); }

        /* Bubble Chart Container */
        #bubble-chart-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
            gap: 15px;
        }
        
        #toggle-pdf-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        #toggle-pdf-btn:hover, #toggle-pdf-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- LAYOUT GRID --- */
        #workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 28% 1fr 0px; /* Timeline | Skills | Detail (Hidden by default) */
            overflow: hidden;
            transition: grid-template-columns 0.3s ease;
            position: relative; /* For overlay */
        }

        #workspace.pdf-open {
            grid-template-columns: 28% 1fr 28%;
        }

        /* --- COLUMN 1: TIMELINE (Compact & Collapsible) --- */
        #col-timeline {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 0; 
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Continuous Vertical Line */
        #col-timeline::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 25px; /* Centered in the 50px gutter */
            width: 2px;
            background: var(--border);
            z-index: 0;
        }

        .tl-group {
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 1;
            /* Indent the blocks to leave space for the timeline line */
            margin-left: 50px; 
            background: var(--bg-sidebar); 
        }
        
        /* Accordion Header */
        .tl-header {
            padding: 15px 15px 15px 15px; /* Reduced left padding as container is indented */
            cursor: pointer;
            background: var(--bg-sidebar);
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .tl-header:hover { background: var(--bg-panel); }
        
        /* Timeline Dot */
        .tl-header::before {
            content: '';
            position: absolute;
            /* Position relative to the header, pushing it left into the gutter */
            left: -31px; /* 25px (center of gutter) - 50px (margin) - 6px (half width) */
            top: 50%; transform: translateY(-50%);
            width: 12px; height: 12px;
            background: var(--bg-sidebar);
            border: 2px solid var(--accent);
            border-radius: 50%;
            z-index: 2;
        }
        .tl-group.expanded .tl-header::before { background: var(--accent); }
        
        .tl-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); display: block; }
        .tl-title { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 2px; }
        .tl-arrow { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
        .tl-group.expanded .tl-arrow { transform: rotate(180deg); }

        /* Accordion Content */
        .tl-body {
            display: none;
            background: rgba(255,255,255,0.03); /* Slight lighten for contrast against dark sidebar */
            padding: 10px 15px 20px 15px;
            border-top: 1px solid var(--border);
        }
        .tl-group.expanded .tl-body { display: block; }
        
        .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; padding: 0 5px; }

        /* Compact Project List */
        .project-list { display: flex; flex-direction: column; gap: 6px; }
        
        .project-btn {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; 
            padding: 8px 10px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .project-btn:hover { border-color: var(--accent); transform: translateX(2px); }
        .project-btn.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        
        .p-name { font-weight: 600; font-size: 0.85rem; color: #e2e8f0; }
        .p-tags { display: flex; gap: 4px; }
        .p-tag { 
            font-family: var(--font-mono); font-size: 0.6rem; color: #94a3b8; 
            background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 2px; 
        }

        /* --- COLUMN 2: SKILL NETWORK (D3 Container) --- */
        #col-nested {
            background-color: var(--bg-main);
            overflow: hidden; 
            padding: 0;
            position: relative;
        }

        .chart-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #chart-container:active {
            cursor: grabbing;
        }

        /* D3 Styles */
        .link {
            fill: none;
            stroke: #4b5563;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
            transition: stroke 0.5s, stroke-opacity 0.5s, d 0.5s;
        }
        .node circle {
            cursor: pointer;
            transition: fill 0.5s, stroke 0.5s, r 0.5s;
        }
        .node text {
            cursor: pointer;
            font-size: 14px;
            fill: var(--text-main);
            font-family: var(--font-mono); /* Use theme font */
            paint-order: stroke;
            stroke: var(--bg-main); /* Match background for halo */
            stroke-width: 3px;
            transition: fill 0.5s, font-weight 0.5s, x 0.5s, text-anchor 0.5s;
        }

        /* Highlights */
        .highlight circle {
            stroke: var(--accent);
            fill: var(--accent);
        }
        .highlight text {
            fill: #93c5fd;
            font-weight: 700;
        }
        .highlight-link {
            stroke: var(--accent);
            stroke-opacity: 1;
        }
        .converge-link {
            stroke: #f59e0b; /* Amber */
            stroke-opacity: 0;
            stroke-width: 2px;
            stroke-dasharray: 6 3;
            transition: stroke-opacity 0.5s, d 0.5s;
        }
        .dimmed {
            opacity: 0.2;
            transition: opacity 0.5s;
        }

        /* Controls */
        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }
        .zoom-controls button {
            width: auto;
            min-width: 30px;
            height: 30px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: bold;
            background-color: rgba(30, 41, 59, 0.9); /* --bg-panel */
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }
        .zoom-controls button:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* --- COLUMN 3: DETAIL (PDF EMBED) --- */
        #col-detail {
            background: var(--bg-sidebar); border-left: 1px solid var(--border);
            padding: 0; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #pdf-container {
            width: 100%;
            height: 100%;
            background: #333;
        }

        /* --- PRINT STYLES --- */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { 
                background: white; color: black; height: auto; display: block; overflow: visible;
                -webkit-print-color-adjust: exact;
            }
            #a4-container {
                width: 100%; aspect-ratio: auto; box-shadow: none; height: 100%;
                background: white; color: black; display: block;
            }
            
            /* Color Overrides */
            :root {
                --bg-main: #ffffff;
                --bg-panel: #f1f5f9;
                --bg-sidebar: #ffffff;
                --accent: #0284c7; /* Darker blue for print */
                --text-main: #000000;
                --text-muted: #475569;
                --border: #cbd5e1;
                --code-bg: #f8fafc;
                --folder-color: #000000;
                --file-color: #334155;
                --tree-hover: #ffffff;
                --tree-guide: #e2e8f0;
                --text-bubble-val: #000000;
                
                /* D3 Node Colors (Print) */
                --node-fill-collapsed: #000000;
                --node-fill-expanded: #ffffff;
                --node-stroke: #000000;
            }

            /* Layout Adjustments for Print */
            header { height: auto; padding: 20px 30px; border-bottom: 2px solid #000; }
            #workspace { display: grid; grid-template-columns: 25% 45% 30%; height: auto; overflow: visible; }
            
            #col-timeline, #col-nested, #col-detail { 
                overflow: visible; height: auto; border: none; background: white; 
            }
            
            #col-nested { border-left: 1px solid #eee; border-right: 1px solid #eee; }

            /* Tree Print Logic: Expand All or Show Flat */
            .tree-children { display: flex !important; margin-left: 10px; } /* Force expand */
            .t-icon { color: #000; }
            
            /* Hide Buttons */
            #reset-btn, .project-btn, .zoom-controls, #toggle-pdf-btn { display: none !important; }
            .project-btn:hover { transform: none; }
            .project-btn.active { background: #f0f0f0 !important; border-color: #000; box-shadow: none; }
            
            /* Ensure text is black */
            .profile h1, .profile .role { color: #000 !important; }
            .p-name, .tl-title, .detail-title, .detail-body p { color: #000 !important; }
            .tl-content { color: #333 !important; }
            .code-block { border: 1px solid #ccc; color: #333; }

            /* Force D3 Text to be black for print (Overrides inline D3 styles) */
            .node text { fill: #000000 !important; font-weight: bold !important; }
            
            /* Reset Interactions for Print */
            .tree-dimmed .tree-row { opacity: 1 !important; }
            .tree-highlight > .tree-row { color: #000 !important; font-weight: normal; }
        }

    </style>
</head>

                // 1. Compute Layouts Independently (Centers them around 0,0)
                tree(rootR);

                if (currentLayoutMode === 'split') {

                    rootL.each(d => {

                        d.isLeft = true;
                    });

                    // Only for direct children of root (depth 1)
                    [rootL, rootR].forEach(r => {

                                 // Current y is calculated by tree (depth * default spacing).
                                 // We override it manually.
                                 // Note: child descendants are relative to child in d3.tree?
                                 // No, d3.tree computes absolute x,y from root.
                                 // If we move child, we must shift all its descendants by the same amount.

                                 // Separate Logic:
                                 // We want to keep them somewhat close but ensure space for the tree icon (at 0,0).
                                 // The tree icon is roughly 40px wide.
                                 // Previously we reduced distance by 70%. Let's check if that's too close.
                                 // Default nodeSize[1] is 160. So child.y is +/- 160.
                                 // 160 * 0.3 = 48.
                                 // 48px from center is enough for a 40px icon.
                                 // However, "separated three points" implies distinct branches.
                                 // Let's use a slightly less aggressive shift to ensure branches are visible.

                                 const shift = child.y * 0.6; // Reduce by 60% (keep 40% -> ~64px)
                                 const deltaY = (child.y > 0 ? -shift : shift);

                                 child.each(d => {
                                     d.y += deltaY;
                                 });
                             });
                         }
                    });

                    // ALIGN TOPS: Removed manual alignment in favor of manual drag (d.data.layout)
                    // However, we still apply the Manual Offsets here if they exist.
                }

                // Apply Manual Layout Offsets (Drag Persistence)
                // Recursive application allows nested offsets (Level 1 moves children, Level 2 moves independently relative to L1)
                if (currentLayoutMode === 'split') {
                    const applyLayoutOffsets = (node) => {
                        if (node.data.layout) {
                            const { dx, dy } = node.data.layout;
                            // Apply to self and all descendants (Cumulative)
                            // Note: Since we traverse top-down, a Level 2 node will receive
                            // its parent's offset first, then its own offset here.
                            node.descendants().forEach(d => {
                                d.y += dx;
                                d.x += dy;
                            });
                        }
                        // Recurse to children to check for their own offsets
                        if (node.children) {
                            node.children.forEach(applyLayoutOffsets);
                        }
                    };

                    [rootR, rootL].forEach(root => {
                        if(root.children) {
                            root.children.forEach(applyLayoutOffsets);
                        }
                    });
                } else {
                    // Unified Mode
                    // Everything is in rootR. No flipping needed.
                    rootR.each(d => {
                         d.isLeft = false;
                    });
                }

                rootR.each(d => {
                    if (currentLayoutMode === 'split') d.isLeft = false;
                });

                // 3. Merge Nodes & Links
                // In Project Mode, we only use rootR (which contains the unified tree).
                // In Split Mode, we use both.
                let nodes = [];
                let links = [];

                if (currentLayoutMode === 'project') {
                     nodes = rootR.descendants();
                     links = rootR.links();
                } else {
                     const nodesR = rootR.descendants();
                     // Exclude rootL's root to avoid duplicates
                     const nodesL = rootL.descendants().filter(d => d.depth > 0);
                     nodes = [...nodesR, ...nodesL].reverse();

                     const linksR = rootR.links();
                     const linksL = rootL.links();
                     links = [...linksR, ...linksL];
                }

                // Nodes
                const node = gNode.selectAll("g.node")
                    .data(nodes, d => d.data.id || d.data.name);

                // Drag Behavior
                const isDraggable = (d) => {
                    if (currentLayoutMode !== 'split') return false;
                    // Level 1 Nodes (Firmware, Hardware, Digital Twins)
                    if (d.depth === 1) return true;
                    // Level 2 Nodes under Digital Twins
                    if (d.depth === 2 && d.parent && d.parent.data.name === "Digital Twins") return true;
                    return false;
                };

                const drag = d3.drag()
                    .on("start", function(event, d) {
                        if (!isDraggable(d)) return;
                        d3.select(this).attr("cursor", "grabbing");
                    })
                    .on("drag", (event, d) => {
                        if (!isDraggable(d)) return;
                        if (!d.data.layout) d.data.layout = { dx: 0, dy: 0 };
                        d.data.layout.dx += event.dx;
                        d.data.layout.dy += event.dy;
                        update(rootR); // Trigger re-render to propagate offsets
                    })
                    .on("end", function(event, d) {
                        if (!isDraggable(d)) return;
                        d3.select(this).attr("cursor", "pointer");
                    });

                const nodeEnter = node.enter().append("g")
                    .attr("class", "node")
                    .attr("id", d => "node-" + (d.data.id || d.data.name.replace(/\s+/g, '_')))
                    .attr("transform", d => `translate(${source.y0},${source.x0})`)
                    .on("click", (event, d) => {
                        if (isDraggable(d)) return; // Avoid collapsing draggable nodes on click

                        // Toggle children on click
                        if (d.children) {
                            d._children = d.children;
                            d.children = null;
                        } else {
                            d.children = d._children;
                            d._children = null;
                        }
                        update(d);
                    });

                // Apply Drag to Draggable Nodes
                nodeEnter.filter(isDraggable).call(drag);

                // Re-apply drag on update (in case mode changed or nodes re-entered)
                node.filter(isDraggable).call(drag);


                // Add Circle (for non-root)
                // We Hide root circle completely
                const circles = nodeEnter.filter(d => d.depth > 0).append("circle")
                    .attr("r", 0) 
                    .attr("fill", d => d._children ? "#0284c7" : (levelColors[d.depth] || "#94a3b8"))
                    .attr("stroke", "var(--node-stroke)")
                    .attr("stroke-width", 1.5);

                // Root Icon (REMOVED - Background SVG used instead)
                // We make the root group invisible/pointer-events none
                nodeEnter.filter(d => d.depth === 0)
                    .attr("pointer-events", "none");

                // Add Text (Initial)
                nodeEnter.append("text")
                    .attr("class", "label-text")
                    .attr("dy", "0.31em")
                    .text(d => d.depth === 0 ? "" : d.data.name) 
                    .style("fill-opacity", 0)
                    .style("font-size", d => levelFontSizes[d.depth] || "12px")
                    .style("fill", d => levelTextColors[d.depth] || "#cbd5e1")
                    .style("font-weight", d => d.depth <= 1 ? "bold" : "normal")
                    .clone(true).lower()
                    .attr("stroke", "var(--bg-main)")
                    .attr("stroke-width", 2); 

                // Transition nodes to their new position.
                const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                nodeUpdate.select("circle")
                    .attr("r", d => levelSizes[d.depth] || 4)
                    .attr("fill", d => {
                        if (currentLayoutMode === 'project') return "var(--accent)";
                        return d._children ? "var(--accent)" : (levelColors[d.depth] || "#94a3b8");
                    });

                // Dynamic Text Anchor based on side
                nodeUpdate.selectAll(".label-text")
                    .text(d => d.depth === 0 ? (currentLayoutMode === 'project' ? d.data.name : "") : d.data.name)
                    .attr("x", d => {
                        if (d.depth === 0) return 0;
                        return d.y < 0 ? -15 : 15;
                    })
                    .attr("dy", d => {
                         if (d.depth === 0 && currentLayoutMode === 'project') return "0.31em";
                         return "0.31em";
                    })
                    .attr("text-anchor", d => {
                        if (d.depth === 0) return "middle";
                        return d.y < 0 ? "end" : "start";
                    })
                    .style("font-size", d => {
                        if (d.depth === 0 && currentLayoutMode === 'project') return "20px"; // Larger Title for Project
                        return levelFontSizes[d.depth] || "12px";
                    })
                    .style("fill", d => {
                         if (d.depth === 0 && currentLayoutMode === 'project') return "#fff";
                         return levelTextColors[d.depth] || "#cbd5e1";
                    })
                    .style("fill-opacity", 1);

                // Transition exiting nodes
                const nodeExit = node.exit().transition().duration(duration)
                    .attr("transform", d => `translate(${source.y},${source.x})`)
                    .remove();

                nodeExit.select("circle").attr("r", 0);
                nodeExit.select(".root-icon").style("font-size", "0px");
                nodeExit.selectAll(".label-text").style("fill-opacity", 0);

                // Links
                const link = gLink.selectAll("path.link")
                    .data(links, d => d.target.data.id || d.target.data.name);

                const linkEnter = link.enter().append("path")
                    .attr("class", "link")
                    .attr("d", d => {
                        const o = {x: source.x0, y: source.y0};
                        return diagonal({source: o, target: o});
                    });

                // Update links - diagonal automatically uses the flipped d.y
                link.merge(linkEnter)
                    .transition().duration(duration)
                    .attr("d", diagonal)
                    .attr("stroke-width", d => d.source.depth === 0 ? 3 : 1.5)
                    .attr("stroke", d => {
                        if (currentLayoutMode === 'project') return "var(--accent)";
                        return d.source.depth === 0 ? "var(--accent)" : "#4b5563";
                    })
                    .attr("stroke-opacity", d => {
                        // Hide root connections in Split Mode
                        if (currentLayoutMode === 'split' && d.source.depth === 0) return 0;
                        return d.source.depth === 0 ? 0.6 : 0.4;
                    });

                // Force visibility update (outside transition for robust hiding)
                link.merge(linkEnter)
                    .attr("display", d => (currentLayoutMode === 'split' && d.source.depth === 0) ? "none" : "block");

                link.exit().transition().duration(duration)
                    .attr("d", d => {
                        const o = {x: source.x, y: source.y};
                        return diagonal({source: o, target: o});
                    })
                    .remove();

                // Stash the old positions for transition.
                nodes.forEach(d => {
                    d.x0 = d.x;
                    d.y0 = d.y;
                });
            }

            // Initial Update
            update(rootR);
            
            // Zoom Support
            // Current Transform Tracker
            let currentTransform = d3.zoomIdentity.translate(width/2, height/2);

            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on("zoom", (event) => {
                    currentTransform = event.transform;
                    g.attr("transform", event.transform);
                    // Clear overlay lines on zoom to avoid mismatch
                });
            
            // Center Initial View (width/2, height/2)
            svg.call(zoom).call(zoom.transform, currentTransform);


            // ==========================================
            // INTERACTION LOGIC (Scoped to instance)
            // ==========================================
            
            // Reset
            window.globalResetView = () => {
                 switchLayoutMode('split');
                 
                 // Reset Zoom
                 svg.transition().duration(750)
                    .call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2));
            };

            // Build Project Hierarchy Helper
            function buildProjectHierarchy(projectName, activeSkills) {
                const activeSet = new Set(activeSkills);

                // Recursive traversal to reconstruct tree with only active paths
                function traverse(node) {
                    const isActive = node.id && activeSet.has(node.id);

                    let keptChildren = [];
                    if (node.children) {
                        node.children.forEach(child => {
                            const result = traverse(child);
                            if (result) keptChildren.push(result);
                        });
                    }

                    // Keep node if it matches OR has kept children
                    if (isActive || keptChildren.length > 0) {
                        // Return new object to avoid mutating original 'children' array permanent
                        // But keep 'data' reference if needed? No, new hierarchy needs clean structure.
                        return {
                            ...node,
                            children: keptChildren.length > 0 ? keptChildren : null
                        };
                    }
                    return null;
                }

                // Process top-level categories
                const newChildren = [];
                if (fullSkillData.children) {
                    fullSkillData.children.forEach(cat => {
                         const filtered = traverse(cat);
                         if (filtered) newChildren.push(filtered);
                    });
                }

                return {
                    name: projectName,
                    children: newChildren
                };
            }

            // Highlight Project (Project Focus View)
            window.globalTriggerProjectSelect = (projectName, btnID) => {
                const project = Object.values(projectsDB).find(p => p.name === projectName);
                if (!project) return;
                
                // 1. Build Filtered Hierarchy
                const newHierarchyData = buildProjectHierarchy(projectName, project.activeSkills);
                
                // 2. Switch Mode
                currentLayoutMode = 'project';

                // Hide Background Tree
                d3.select(".bg-layer").transition().duration(500).style("opacity", 0);

                // 3. Create New Root
                rootR = d3.hierarchy(newHierarchyData);
                rootR.x0 = 0; rootR.y0 = 0;

                // Force expand all in this new view
                rootR.descendants().forEach(d => {
                    d.children = d.children;
                    d._children = null;
                });
                
                // 4. Update
                update(rootR);

                // 5. Visual Styling (Immediate)
                // Styling is now handled inside update() to prevent transition conflicts
            };
            
            d3.select("#zoom-reset").on("click", window.globalResetView);
        }

        // Bridge function for Timeline
        function selectProject(pid) {
            // 1. Highlight Project Button (Timeline)
            document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
            const btnID = `btn-${pid}`;
            const btn = document.getElementById(btnID);
            if(btn) btn.classList.add('active');

            // 2. Trigger D3 Animation
            if(window.globalTriggerProjectSelect && projectsDB[pid]) {
                window.globalTriggerProjectSelect(projectsDB[pid].name, btnID);
            }
        }

        // ==========================================
        // 4. HEADER BUBBLE CHART
        // ==========================================
        function drawHeaderBubbles() {
            const container = d3.select("#bubble-chart-container");
            const width = 500; 
            const height = 130; 

            // 1. Process Data: Count leaves per top-level category
            const root = d3.hierarchy(fullSkillData);
            const categories = root.children.map(cat => {
                // Count all descendants for "weight"
                return {
                    name: cat.data.name,
                    value: cat.descendants().length
                };
            });
            
            const packData = { children: categories };
            const rootPack = d3.hierarchy(packData).sum(d => d.value);

            // 2. Layout
            const pack = d3.pack()
                .size([width, height])
                .padding(15);
            
            pack(rootPack);

            // 3. SVG
            const svg = container.insert("svg", ":first-child")
                .attr("width", width)
                .attr("height", height)
                .style("margin-right", "auto") // Push to left if we want, or keep centered
                .style("overflow", "visible");

            const nodes = svg.selectAll("g")
                .data(rootPack.children)
                .join("g")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            // Colors
            const colorMap = {
                "Firmware": "#38bdf8",     // Blue
                "Hardware": "#34d399",     // Green
                "Digital Twins": "#a78bfa" // Purple
            };

            // Bubble
            nodes.append("circle")
                .attr("r", d => d.r)
                .attr("fill", d => colorMap[d.data.name] || "#94a3b8")
                .attr("opacity", 0.15)
                .attr("stroke", d => colorMap[d.data.name] || "#94a3b8")
                .attr("stroke-width", 1.5)
                .style("cursor", "default");

            // Label (Name)
            nodes.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "-0.3em")
                .style("font-size", d => d.r < 35 ? "10px" : "12px")
                .style("fill", "#e2e8f0")
                .style("font-weight", "600")
                .style("font-family", "var(--font-mono)")
                .style("pointer-events", "none")
                .each(function(d) {
                    const el = d3.select(this);
                    const name = d.data.name;
                    // Split long names if bubble is small
                    if (name.includes(" ") && d.r < 40) {
                        const parts = name.split(" ");
                        el.append("tspan").attr("x", 0).attr("dy", "-0.2em").text(parts[0]);
                        el.append("tspan").attr("x", 0).attr("dy", "1.1em").text(parts[1]);
                    } else {
                        el.text(name);
                    }
                });
                
            // Label (Count/%)
            nodes.append("text")
                .text(d => Math.round((d.data.value / rootPack.value) * 100) + "%")
                .attr("text-anchor", "middle")
                .attr("dy", d => d.data.name.includes(" ") && d.r < 40 ? "2.3em" : "1.2em")
                .style("font-size", d => d.r < 35 ? "10px" : "11px")
                .style("fill", "var(--accent)")
                .style("pointer-events", "none");
        }

        // Init
        window.onload = () => {
            renderTimeline();
            drawHorizontalTree(); 
            drawHeaderBubbles();
        };


        function togglePDF() {
            const ws = document.getElementById('workspace');
            const btn = document.getElementById('toggle-pdf-btn');
            ws.classList.toggle('pdf-open');
            btn.classList.toggle('active');

            // Update button text
            const isPDFOpen = ws.classList.contains('pdf-open');
            btn.innerHTML = isPDFOpen ? '📄 Hide PDF' : '📄 PDF Viewer';
            
            // Resize chart after transition
            setTimeout(() => {
                // We need to trigger a redraw or resize event if D3 doesn't auto-handle it.
                // Re-running drawHorizontalTree() is the safest way to correct centering.
                drawHorizontalTree();
            }, 350);
        }

    </script>
</body>
